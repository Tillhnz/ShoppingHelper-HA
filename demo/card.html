<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shopping Helper Karte – Demo</title>
  <style>
    :root {
      --primary-color: #03a9f4; --primary-background-color: #fafafa; --card-background-color: #fff;
      --secondary-background-color: #f0f0f0; --primary-text-color: #212121; --secondary-text-color: #727272;
      --divider-color: rgba(0,0,0,.12); --success-color: #43a047; --error-color: #db4437;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --primary-background-color: #111111; --card-background-color: #1c1c1c; --secondary-background-color: #282828;
        --primary-text-color: #e1e1e1; --secondary-text-color: #9b9b9b; --divider-color: rgba(225,225,225,.12);
      }
    }
    body { margin: 0; padding: 16px; background: var(--primary-background-color); font-family: Roboto, system-ui, sans-serif; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; align-items: start; max-width: 1100px; margin: 0 auto; }
  </style>
</head>
<body>
  <!-- Dashboard card with sample data – no Home Assistant needed. Actions are simulated locally. -->
  <div class="cards"></div>
  <script src="sample-data.js"></script>
  <script src="demo-hass.js"></script>
  <script src="../custom_components/shopping_helper/frontend/shopping-helper-card.js"></script>
  <script>
    const configs = [
      {},
      { title: "Nur Cookidoo", filter: "cookidoo", show_add: false, show_suggestions: false },
      { title: "Kompakt", icon: "mdi:basket", group_by_category: false, compact: true, max_items: 6, show_progress: false, show_sources: false },
      { show_header: false, entities: ["todo.einkaufsliste"], hide_categories: ["drugstore", "household"], show_suggestions: false, max_height: 220 },
    ];
    for (const config of configs) {
      const card = document.createElement("shopping-helper-card");
      card.setConfig(config);
      document.querySelector(".cards").appendChild(card);
      card.hass = window.mockHass;
    }
    addEventListener("hass-notification", (e) => console.info("Toast:", e.detail.message));
  </script>
</body>
</html>
